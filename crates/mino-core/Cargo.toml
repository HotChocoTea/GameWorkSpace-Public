[package]
name = "mino-core"
version = "0.1.0"
edition = "2021"

[dependencies]
calamine = { version = "0.31", features = ["dates"] }
csv = "1"
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
thiserror.workspace = true

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
base64 = "0.21"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
