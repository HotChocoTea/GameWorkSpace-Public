[workspace]
members = ["crates/mino-core", "crates/mino-mcp", "src-tauri"]
resolver = "2"

[workspace.dependencies]
mino-core = { path = "crates/mino-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "serde_json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[profile.dev]
debug = 1
