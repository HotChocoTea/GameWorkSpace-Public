[package]
name = "mino-studio"
version = "0.1.0"
edition = "2021"
default-run = "gameworkspace"

[[bin]]
name = "gameworkspace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mino-core.workspace = true
mino-mcp = { path = "../crates/mino-mcp" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
