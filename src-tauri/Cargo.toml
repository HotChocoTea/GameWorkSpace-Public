[package]
name = "gameworkspace"
version = "2.1.0"
edition = "2021"
default-run = "gameworkspace"

[[bin]]
name = "gameworkspace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gws-core.workspace = true
gws-mcp = { path = "../crates/gws-mcp" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
